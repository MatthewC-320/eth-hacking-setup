
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAINLOG</title>
</head>

<!--the styling's just for fun :)-->
<body>

    <div class="window" style="top: 50%; left: 50%; transform:translate(-50%, -50%); width: 600px; height: 350px;">

        <div class="title-bar">
            <span>upload-me</span>
            <div class="buttons">
                <span>X</span>
            </div>
        </div>

        <div class="content">
            <form action="/upload" method="POST">
                <div style="display: flex; justify-content: space-between">
                    <div class="row">
                        <label for="filename">filename</label><br>
                        <input type="text" id="filename" name="filename" required>
                    </div>

                    <div class="row">
                        <label for="content">content</label><br>
                        <input type="text" id="content" name="content" required>
                    </div>
                </div>

                <button>send...</button>

            </form>
        </div>
    </div>

</body>

<style>

.bigfuck {
    font-family: 'loveletter';
    position: absolute;
    z-index: 10;
    font-size: 50px;
    top: -50px;
}

.red {
    color: red;
}

@font-face {
    font-family: 'loveletter';
    src: url('../static/loveit.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: 'chicago';
    src: url('../static/chicago.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

button {
    background-color: black;
    color: white;
    border-radius: 5px double black;
    padding-inline: 20px;
    padding-block: 5px;
    font-family: 'chicago'; 
    margin-top: 30px;
    transition: 0.3s;
    float: right;
    cursor: pointer;
}

button:hover {
    filter: invert(1);
}

form {
    padding-inline: 50px
}

form input {
    font-family: 'chicago';
}

.row {
    margin-top: 20px;
}

pre {
    overflow-x: auto;
    overflow-y: auto;
    font-size: 10px;
}

code {
    font-family: 'chicago';
}

.title-bar {
    display: flex;
    background-color: gray;
    width: 100%;
    position: absolute;
    left: 0;
    top: 0;
    z-index: 20;
    color: black;
    justify-content: space-between;
    border-bottom: 4px solid gray;
}

.title-bar span {
    padding-inline: 20px;
    border-right: 1px solid white;
    border-bottom: 1px solid white;
    transition: 0.3s;
    cursor: pointer;
}

.title-bar span:hover {
    filter: invert(1);
}
.content {
    z-index: 7;
    margin-block: 15px;
}

body {
    margin: 0;
    background-color: black;
    color: white;
    background-image: url('../static/static.gif');
}

.window {
    position: absolute;
    z-index: 10;
    width: 300px;
    height: 200px;
    font-family: 'chicago';
    background-color: #111111;
    color: #ececec;
    padding: 20px;
    opacity: 0.8;
    border: 8px double gray;
    font-size: 15px;

}


.window:before {
    background-image: url('../static/copland.png');
    position: absolute;
    left: 50%;
    top: 50%;
    width: 50%;
    aspect-ratio: 1/1;
    content: '';
    transform: translate(-50%, -50%);
    display: block;
    background-size: contain;
    opacity: 0.3;
    z-index: 5;
    pointer-events: none;
}

.abs {
    width: 100%;
    text-align: center;
    position: absolute;
    z-index: 0;
}
.banner {
    width: 100%;
    margin: auto;
}

.banner img {
    width: 100%;
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
}
.header {
    background-color: rgb(11, 11, 11);
    font-family: 'loveletter';
    text-align: center;
    margin-top: 20px;
}

.blinking {
    animation: blink-animation 1s infinite;
}

@keyframes blink-animation {
    0%, 100% {
        opacity: 1; 
    }
    50% {
        opacity: 0;
    }
}


</style>
